worker_processes 1;
daemon off;
master_process off;

pid "/Users/hanxiaoqing/Library/Application Support/LightNodeHostRelay/nginx.pid";
error_log "/Users/hanxiaoqing/Library/Logs/LightNodeHostRelay/error.log" info;

events {
    worker_connections 64;
}

stream {
    log_format relay '$time_iso8601 remote=$remote_addr status=$status '
                     'duration=$session_time bytes_in=$bytes_received bytes_out=$bytes_sent';
    access_log "/Users/hanxiaoqing/Library/Logs/LightNodeHostRelay/access.log" relay;

    server {
        listen 100.90.42.40:15900;

        allow 100.64.0.0/10;
        deny all;

        proxy_bind 10.211.55.1;
        proxy_pass 10.211.55.4:5900;
        proxy_connect_timeout 5s;
        proxy_timeout 8h;
        proxy_socket_keepalive on;
    }
}
