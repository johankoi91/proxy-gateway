name: lightnode-linux-controller

services:
  controller:
    build:
      context: .
      network: host
    image: lightnode/linux-controller:0.1.0-alpha.3-amd64
    container_name: lightnode-linux-controller
    network_mode: host
    environment:
      LIGHTNODE_CONTROLLER_ADMIN_USER: ${CONTROLLER_USER:-}
      LIGHTNODE_CONTROLLER_ADMIN_PASSWORD: ${CONTROLLER_PASSWORD:-}
      LIGHTNODE_CONTROLLER_TLS_CERT: ${CONTROLLER_TLS_CERT:-}
      LIGHTNODE_CONTROLLER_TLS_KEY: ${CONTROLLER_TLS_KEY:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /etc/lightnode-linux-controller:/etc/lightnode-linux-controller:ro
      - /run/lightnode-linux-controller:/run/lightnode-linux-controller
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/libexec/lightnode-linux-controller/lightnode-linux-controller", "container-health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
