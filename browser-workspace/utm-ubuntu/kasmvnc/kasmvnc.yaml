desktop:
  resolution:
    width: 1680
    height: 1050
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 8443
  use_ipv4: true
  use_ipv6: false
  ssl:
    pem_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
    pem_key: /etc/ssl/private/ssl-cert-snakeoil.key
    require_ssl: true

encoding:
  max_frame_rate: 60
  rect_encoding_mode:
    min_quality: 6
    max_quality: 8
    consider_lossless_quality: 9
  scrolling:
    detect_vertical_scrolling: true
    detect_horizontal_scrolling: true
    scroll_detect_threshold: 5%

server:
  http:
    headers:
      - Cross-Origin-Embedder-Policy=require-corp
      - Cross-Origin-Opener-Policy=same-origin
      - Cache-Control=no-store
