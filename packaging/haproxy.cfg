global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode tcp
  option tcplog
  option tcpka
  timeout connect 5s
  timeout client 30m
  timeout server 30m

frontend tls_mux
  bind 0.0.0.0:443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  acl has_sni req.ssl_sni -m found
  use_backend admin_https unless has_sni
  use_backend admin_https if { req.ssl_sni -i "${ADMIN_SERVER_NAME}" }
  default_backend vless_reality

backend admin_https
  server admin 127.0.0.1:9080 check

backend vless_reality
  server xray 127.0.0.1:8443 check
