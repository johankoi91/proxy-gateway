services:
  desktop:
    build: .
    image: lightnode/selkies-chromium:2.0.6-amd64
    container_name: beijing-selkies-chromium
    hostname: beijing-selkies-chromium
    environment:
      TZ: Asia/Tokyo
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      GTK_IM_MODULE: fcitx
      QT_IM_MODULE: fcitx
      XMODIFIERS: "@im=fcitx"
      SDL_IM_MODULE: fcitx
      PASSWD: ${SELKIES_PASSWORD:?SELKIES_PASSWORD is required}
      SELKIES_BASIC_AUTH_USER: ${SELKIES_USER:-admin}
      SELKIES_BASIC_AUTH_PASSWORD: ${SELKIES_PASSWORD:?SELKIES_PASSWORD is required}
      SELKIES_ENABLE_BASIC_AUTH: "true"
      SELKIES_ENABLE_HTTPS: "true"
      SELKIES_PORT: "8445"
      SELKIES_MODE: webrtc
      SELKIES_ENABLE_DUAL_MODE: "false"
      SELKIES_WEBRTC_PUBLIC_IP: ${SELKIES_PUBLIC_IP:-154.8.225.152}
      SELKIES_WEBRTC_UDP_MUX_PORT: "59000"
      SELKIES_WEBRTC_TCP_MUX_PORT: "59000"
      SELKIES_WEBRTC_ICE_LITE: "true"
      SELKIES_ENCODER: h264enc
      SELKIES_FRAMERATE: 45-45
      SELKIES_RATE_CONTROL_MODE: cbr
      SELKIES_VIDEO_BITRATE: 10000,5000-12000
      SELKIES_CONGESTION_CONTROL: "true"
      SELKIES_KEYFRAME_INTERVAL: "0"
      SELKIES_ENABLE_RESIZE: "true"
      SELKIES_MANUAL_RESOLUTION: "true"
      SELKIES_MANUAL_WIDTH: "2560"
      SELKIES_MANUAL_HEIGHT: "1440"
      SELKIES_USE_CSS_SCALING: "false"
      SELKIES_ENABLE_CLIPBOARD: "true"
      SELKIES_ENABLE_BINARY_CLIPBOARD: "true"
      SELKIES_FILE_TRANSFERS: upload,download
      SELKIES_UI_TITLE: Beijing Browser (Selkies)
    ports:
      - "${SELKIES_BIND_IP:-10.2.0.12}:8445:8445/tcp"
      - "${SELKIES_BIND_IP:-10.2.0.12}:59000:59000/udp"
      - "${SELKIES_BIND_IP:-10.2.0.12}:59000:59000/tcp"
      - "${SELKIES_BIND_IP:-10.2.0.12}:5190:5190/tcp"
      - "127.0.0.1:9222:9222/tcp"
    volumes:
      - selkies-home:/home/ubuntu
    shm_size: 2gb
    security_opt:
      # Chrome creates its own user/PID/seccomp sandbox. Docker's default
      # seccomp profile blocks the namespace setup it needs.
      - seccomp=unconfined
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS --max-time 3 -u \"$${SELKIES_BASIC_AUTH_USER}:$${SELKIES_BASIC_AUTH_PASSWORD}\" https://127.0.0.1:8445/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s

  api:
    build:
      context: ../claude-browser-api
    image: lightnode/claude-browser-api:0.2.0
    container_name: claude-browser-api
    network_mode: service:desktop
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 9186
      API_MOCK: ${API_MOCK:-0}
      API_MAX_PROMPT_CHARS: ${API_MAX_PROMPT_CHARS:-8000}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5190}
      CDP_URL: http://127.0.0.1:9222
      CLAUDE_BROWSER_API_TOKEN: ${CLAUDE_BROWSER_API_TOKEN:?CLAUDE_BROWSER_API_TOKEN is required}
      API_TLS_CERT: /etc/lightnode-linux-controller/controller.crt
      API_TLS_KEY: /etc/lightnode-linux-controller/controller.key
    restart: unless-stopped
    user: "0:0"
    read_only: true
    volumes:
      - /etc/lightnode-linux-controller:/etc/lightnode-linux-controller:ro
      - selkies-home:/home/ubuntu
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      desktop:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({hostname:'127.0.0.1',port:9186,path:'/healthz',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: web/gateway.Dockerfile
    image: lightnode/claude-browser-web:0.1.0
    container_name: claude-browser-web
    network_mode: service:desktop
    environment:
      CLAUDE_BROWSER_API_TOKEN: ${CLAUDE_BROWSER_API_TOKEN:?CLAUDE_BROWSER_API_TOKEN is required}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m

volumes:
  selkies-home:
